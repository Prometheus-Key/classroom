<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>展示ブース 3Dビューワー</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; cursor: pointer; text-align: center; z-index: 10;
    }
    #ui-container {
      position: absolute; top: 12px; right: 12px; z-index: 20; display: flex; gap: 8px;
    }
    .mode-btn {
      background: rgba(30, 30, 30, 0.85); color: white; border: 1px solid #555;
      padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; backdrop-filter: blur(4px);
    }
    #mode-indicator {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(0,0,0,0.6); color: #00ffcc; padding: 6px 10px;
      border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none;
    }

    /* スマホ用タッチUI */
    #mobile-controls {
      display: none;
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 15;
    }
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 50px; height: 50px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    #look-zone {
      position: absolute; top: 0; right: 0; width: 60%; height: 100%;
      pointer-events: auto; touch-action: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="mode-indicator">モード: 俯瞰（ドラッグで回転）</div>

  <div id="ui-container">
    <button id="toggle-mode-btn" class="mode-btn">歩行モードへ切替</button>
  </div>

  <!-- スマホ用コントローラーUI -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
    <div id="look-zone"></div>
  </div>

  <div id="overlay">
    <h2>クリックして歩行開始</h2>
    <div style="font-size: 13px; color: #ccc; margin-top: 8px; line-height: 1.6; padding: 0 20px;">
      <b>【PC】</b><br>
      移動: W/A/S/D | 上昇・下降: Space / Shift<br>
      視点: マウス | 解除: Esc<br><br>
      <b>【スマホ】</b><br>
      左スティック: 移動 | 右側スワイプ: 視点回転
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f4);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(5, 12, 7);
    scene.add(dirLight);

    // コントローラー
    const pointerControls = new PointerLockControls(camera, document.body);
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.05;
    orbitControls.target.set(0, 1, 0);

    let isWalkMode = false;
    orbitControls.enabled = true;

    // UI
    const overlay = document.getElementById('overlay');
    const modeIndicator = document.getElementById('mode-indicator');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const mobileControls = document.getElementById('mobile-controls');

    function updateModeDisplay() {
      if (isWalkMode) {
        modeIndicator.innerText = 'モード: 歩行 (すり抜け可)';
        toggleBtn.innerText = '俯瞰モードへ';
        if (isTouchDevice) mobileControls.style.display = 'block';
      } else {
        modeIndicator.innerText = 'モード: 俯瞰（回転・拡縮）';
        toggleBtn.innerText = '歩行モードへ';
        mobileControls.style.display = 'none';
      }
    }

    function switchMode() {
      isWalkMode = !isWalkMode;
      if (isWalkMode) {
        orbitControls.enabled = false;
        if (!isTouchDevice) {
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
        }
      } else {
        if (!isTouchDevice) pointerControls.unlock();
        orbitControls.enabled = true;
        overlay.style.display = 'none';
      }
      updateModeDisplay();
    }

    toggleBtn.addEventListener('click', switchMode);

    overlay.addEventListener('click', () => {
      if (isWalkMode && !isTouchDevice) pointerControls.lock();
    });
    pointerControls.addEventListener('lock', () => overlay.style.display = 'none');
    pointerControls.addEventListener('unlock', () => {
      if (isWalkMode && !isTouchDevice) overlay.style.display = 'flex';
    });

    // キーボード入力 (PC)
    const move = { forward: false, backward: false, left: false, right: false, up: false, down: false };
    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyV') { switchMode(); return; }
      if (!isWalkMode) return;
      if (e.code === 'KeyW') move.forward = true;
      if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyA') move.left = true;
      if (e.code === 'KeyD') move.right = true;
      if (e.code === 'Space') move.up = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.down = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') move.forward = false;
      if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left = false;
      if (e.code === 'KeyD') move.right = false;
      if (e.code === 'Space') move.up = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.down = false;
    });

    // タッチ操作（スマホ用バーチャルパッド）
    let touchMoveVector = { x: 0, y: 0 };
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };

    joystickZone.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joystickZone.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    });

    joystickZone.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          const dx = touch.clientX - joyCenter.x;
          const dy = touch.clientY - joyCenter.y;
          const dist = Math.min(45, Math.hypot(dx, dy));
          const angle = Math.atan2(dy, dx);
          const knobX = Math.cos(angle) * dist;
          const knobY = Math.sin(angle) * dist;
          joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
          touchMoveVector.x = knobX / 45;
          touchMoveVector.y = -knobY / 45; // 前進が正
        }
      }
    });

    const resetJoy = () => {
      joyTouchId = null;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      touchMoveVector = { x: 0, y: 0 };
    };
    joystickZone.addEventListener('touchend', resetJoy);
    joystickZone.addEventListener('touchcancel', resetJoy);

    // タッチ視点回転（右画面スワイプ）
    const lookZone = document.getElementById('look-zone');
    let lookTouchId = null;
    let lastLookX = 0, lastLookY = 0;
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');

    lookZone.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      lookTouchId = touch.identifier;
      lastLookX = touch.clientX;
      lastLookY = touch.clientY;
      euler.setFromQuaternion(camera.quaternion);
    });

    lookZone.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId) {
          const deltaX = touch.clientX - lastLookX;
          const deltaY = touch.clientY - lastLookY;
          lastLookX = touch.clientX;
          lastLookY = touch.clientY;

          euler.setFromQuaternion(camera.quaternion);
          euler.y -= deltaX * 0.005;
          euler.x -= deltaY * 0.005;
          euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
          camera.quaternion.setFromEuler(euler);
        }
      }
    });

    const resetLook = () => { lookTouchId = null; };
    lookZone.addEventListener('touchend', resetLook);
    lookZone.addEventListener('touchcancel', resetLook);

    // モデル読み込み
    const loader = new GLTFLoader();
    loader.load('./booth.glb', (gltf) => {
      scene.add(gltf.scene);
    }, undefined, (err) => console.error(err));

    // メインループ
    const clock = new THREE.Clock();
    const speed = 4.5;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isWalkMode) {
        if (!isTouchDevice && pointerControls.isLocked) {
          if (move.forward) pointerControls.moveForward(speed * delta);
          if (move.backward) pointerControls.moveForward(-speed * delta);
          if (move.left) pointerControls.moveRight(-speed * delta);
          if (move.right) pointerControls.moveRight(speed * delta);
          if (move.up) camera.position.y += speed * delta;
          if (move.down) camera.position.y -= speed * delta;
        } else if (isTouchDevice) {
          // スマホ用移動計算（向いている水平方向へ進む）
          const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
          const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

          camera.position.addScaledVector(forward, touchMoveVector.y * speed * delta);
          camera.position.addScaledVector(right, touchMoveVector.x * speed * delta);
        }
      } else {
        orbitControls.update();
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateModeDisplay();
  </script>
</body>
</html>
