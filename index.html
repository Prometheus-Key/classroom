<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>学祭展示ブース 3Dプレビュー</title>
  <!-- model-viewer 公式スクリプトの読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .ar-button {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!--
    src にBlenderから書き出したglbファイル名を指定します。
    camera-controls: マウスやスワイプで回転・拡大縮小
    ar: スマホで原寸大AR表示を有効化
  -->
  <model-viewer
    src="./booth.glb"
    alt="学祭展示ブース予想図"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look">
    <button slot="ar-button" class="ar-button">📱 現地に原寸大で配置 (AR)</button>
  </model-viewer>

</body>
</html>
